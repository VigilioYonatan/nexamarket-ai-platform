global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels: {service: nexamarket, environment: self-hosted}
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: nexamarket-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/private/metrics_token
    static_configs:
      - targets: [api:4000]
        labels: {component: commerce-api}
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
