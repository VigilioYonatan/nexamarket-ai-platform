receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
processors:
  memory_limiter: {check_interval: 5s, limit_mib: 192, spike_limit_mib: 48}
  batch: {timeout: 5s, send_batch_size: 256}
  resource:
    attributes:
      - {key: deployment.environment, value: self-hosted, action: upsert}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
