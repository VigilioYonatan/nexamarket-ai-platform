name: nexamarket
services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    volumes:
      - ../infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web, keycloak, seaweedfs]
    networks: [edge, backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/config, /data]
  api:
    &api
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://nexa:${POSTGRES_PASSWORD}@postgres:5432/nexamarket
      KEYCLOAK_ISSUER: https://${APP_DOMAIN}/identity/realms/nexamarket
      KEYCLOAK_INTERNAL_BASE: http://keycloak:8080/identity
      PUBLIC_URL: https://${APP_DOMAIN}
      WEB_ORIGIN: https://${APP_DOMAIN}
      AI_BASE_URL: http://ai:8100
      SEAWEED_FILER_URL: http://seaweedfs:8888
      OTEL_SERVICE_NAME: nexamarket-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, observability]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexa:${POSTGRES_PASSWORD}@postgres:5432/nexamarket
      KEYCLOAK_ISSUER: https://${APP_DOMAIN}/identity/realms/nexamarket
      KEYCLOAK_INTERNAL_BASE: http://keycloak:8080/identity
      PUBLIC_URL: https://${APP_DOMAIN}
      WEB_ORIGIN: https://${APP_DOMAIN}
      AI_BASE_URL: http://ai:8100
      SEAWEED_FILER_URL: http://seaweedfs:8888
      OTEL_SERVICE_NAME: nexamarket-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
  migration:
    <<: *api
    profiles: [tools]
    restart: "no"
    command: ["node", "dist/scripts/migrate.js"]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexamarket
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../infra/postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/01-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexamarket"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start", "--import-realm", "--http-enabled=true"]
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${APP_DOMAIN}/identity
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ../infra/keycloak/realm:/opt/keycloak/data/import:ro
      - ../infra/keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  seaweedfs:
    image: chrislusf/seaweedfs:3.87
    command: ["server", "-dir=/data", "-filer"]
    restart: unless-stopped
    volumes: [seaweed_data:/data]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  valkey:
    image: valkey/valkey:8-alpine
    user: "999:1000"
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ai:
    build:
      context: ..
      dockerfile: infra/docker/ai.Dockerfile
    restart: unless-stopped
    profiles: [ai]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [ollama]
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
  ollama:
    image: ollama/ollama:0.12.5
    restart: unless-stopped
    profiles: [ai]
    volumes: [ollama_data:/root/.ollama]
    networks: [backend]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    restart: unless-stopped
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [../infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [observability]
  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../infra/observability/private/metrics_token:/etc/prometheus/private/metrics_token:ro
      - prometheus_data:/prometheus
    networks: [backend, observability]
  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ../infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    networks: [observability]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_SECURITY_COOKIE_SECURE: "false" # only reachable via SSH tunnel to loopback
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3001:3000"]
    networks: [observability]
networks:
  edge: {}
  backend: {internal: true}
  observability: {internal: true}
volumes:
  pg_data: {}
  seaweed_data: {}
  caddy_data: {}
  caddy_config: {}
  ollama_data: {}
  prometheus_data: {}
  tempo_data: {}
  grafana_data: {}
