name: nexamarket-ci-test
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test_pass_only_local
      POSTGRES_DB: nexamarket_test
    tmpfs: [/var/lib/postgresql/data]
    ports: ["127.0.0.1:5445:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d nexamarket_test"]
      interval: 2s
      timeout: 2s
      retries: 20
